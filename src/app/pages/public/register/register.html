<form (ngSubmit)="register()">
    <h1>REGISTER</h1>

    <div class ="field">
        <label for="email"> Email: </label>
        <input type="email" id="email" placeholder="example.@hotmail.com" name="email"[(ngModel)]="email">

    </div>

    <div class ="field">
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="*****" name="password"[(ngModel)]="password">


    </div>

<button type="submit">login</button>







</form>
